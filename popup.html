<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 240px;
      padding: 12px;
      background-color: #0f0f0f;
      color: #f1f1f1;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px 0;
      color: #a970ff;
      font-size: 15px;
      font-weight: 600;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }
    .label-text {
      font-size: 13px;
      color: #aaaaaa;
    }
    /* Toggle switch styles */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333333; transition: .2s; border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: #ffffff; transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #a970ff; }
    input:checked + .slider:before { transform: translateX(16px); }
  </style>
</head>
<body>
  <h3>SwitchChat Configuration</h3>
  <div class="setting-row">
    <span class="label-text">Enable BTTV & 7TV Emotes</span>
    <label class="switch">
      <input type="checkbox" id="emote-toggle">
      <span class="slider"></span>
    </label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
